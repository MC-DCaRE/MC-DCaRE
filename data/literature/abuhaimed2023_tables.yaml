  Kidneys: [0.26, 0.21, 0.20, 0.18, 0.18, 0.19, 0.20]
  Pancreas: [0.34, 0.27, 0.24, 0.22, 0.22, 0.24, 0.24]
  Spleen: [0.82, 0.67, 0.58, 0.54, 0.53, 0.56, 0.60]
