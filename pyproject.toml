[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mc-dcare"
version = "0.1.0"
description = "Monte Carlo Dose Calculation and Radiation Evaluation"
authors = [
    {name = "MC-DCaRE Team"}
]
readme = "README.md"
license = {text = "LICENSE"}
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "typer",
    "rich",
    "pytest>=8.3.5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
