# DCFs recomputed 2026-08-11 with unified normalization
# (fix-normalization-unified-dcf): raw_absolute_dose_Gy divides by the
# scorer-active history count (TOPAS CSV Histories_with_Scorer_Active) rather
# than metadata total_histories.
#
# Source: 5 direct-beam calibration runs at 180M histories (5M x 36 sequential
# times) with water-filled chamber cavities (water_chamber_enabled=True):
#   80 FF  -> runfolder/2026-08-11_14-33-57, 100 FF -> 2026-08-11_15-34-37,
#   125 FF -> runfolder/2026-08-11_16-34-38,  125 HF -> 2026-08-11_17-33-14,
#   140 HF -> runfolder/2026-08-11_18-32-20.
#
# dcf_tle (Track Length Estimator, fluence-based): transferable DCF valid for
# both CTDI CTDIw and phantom organ dose (TLE is geometry-independent per-
# history). On the 125 kV HF pelvis phantom: TLE effective dose = 5.70 mSv.
#
# dcf_water_dtm (DoseToMaterial in the water-filled CTDI chamber plug):
# CTDI-phantom-specific calibration that also transfers to the phantom body.
# Cross-validates dcf_tle (within 4% across all 5 protocols). On the 125 kV HF
# pelvis phantom: DTM effective dose = 5.46 mSv (4% vs TLE, both consistent
# with the 5.4 mSv Hauri 2017 literature value).
#
# dcf_dtm (body tissue): REMOVED. The prior value (0.02761 for 125 HF) was
# circular — derived from the reference effective dose (E_ref / E_raw_MC) and
# thus reproduced that reference by construction. The phantom effective dose
# now comes from applying CTDI-derived DCFs (dcf_tle for TLE scorer,
# dcf_water_dtm for DTM scorer) to the voxelized phantom.
#
# Selection-bias fix (2026-08-12): PhantomDoseCalculator previously skipped
# voxels with dose <= 0, which exclusively removed DTM voxels (collision-based;
# many zeros in low-fluence organs) while keeping all TLE voxels. This inflated
# DTM organ means by up to 11x, producing the spurious "DTM doesn't transfer"
# conclusion. The fix includes zero-dose voxels in the mean.
machine: TrueBeam
date_calibrated: '2026-08-11'

# Reference effective doses (mSv) for the generic 80 kg reference phantom.
effective_dose_references:
  # Per-protocol reference effective dose with provenance. Values are the
  # PCXMC-derived whole-body E for the generic 80 kg / 180 cm reference adult
  # (source: research/2023 - CBCT Mode Standardisation/TrueBeamCBCTmodes.xlsx).
  # `phantom` records which phantom produced/anchors each reference so the
  # size-based comparison knows what it is validating against.
  "4D Spotlight": {reference_mSv: 1.6, phantom: MRCP_AM, source: "PCXMC, TrueBeamCBCTmodes.xlsx"}
  "4D Thorax": {reference_mSv: 3.3, phantom: MRCP_AM, source: "PCXMC, TrueBeamCBCTmodes.xlsx"}
  "Abdo Spotlight": {reference_mSv: 1.2, phantom: MRCP_AM, source: "PCXMC, TrueBeamCBCTmodes.xlsx"}
  "Abdomen": {reference_mSv: 2.8, phantom: MRCP_AM, source: "PCXMC, TrueBeamCBCTmodes.xlsx"}
  "Breast 360": {reference_mSv: 0.2, phantom: MRCP_AF, source: "PCXMC, TrueBeamCBCTmodes.xlsx"}
  "Extremity Spotlight": {reference_mSv: 0.5, phantom: MRCP_AM, source: "PCXMC, TrueBeamCBCTmodes.xlsx"}
  "Head": {reference_mSv: 0.5, phantom: MRCP_AM, source: "PCXMC, TrueBeamCBCTmodes.xlsx"}
  "Head and Shoulders": {reference_mSv: 0.3, phantom: MRCP_AM, source: "PCXMC, TrueBeamCBCTmodes.xlsx"}
  "Head SRS": {reference_mSv: 1.8, phantom: MRCP_AM, source: "PCXMC, TrueBeamCBCTmodes.xlsx"}
  "Pelvis": {reference_mSv: 4.2, phantom: MRCP_AM, source: "PCXMC, TrueBeamCBCTmodes.xlsx"}
