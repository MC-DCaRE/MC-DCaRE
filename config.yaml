# MC-DCaRE default configuration
# Loaded by the GUI on startup and by generate-config
# g4_data_directory and topas_directory can also be set via
# environment variables G4DATA_DIR and TOPAS_DIR
# Priority: config.yaml -> env vars -> /root/ fallback

general:
  g4_data_directory: /root/G4Data
  topas_directory: /root/topas/bin/topas
  seed: '9'
  threads: '1'
  histories: '100000'
imaging:
  simulation_type: DICOM
  start_angle: 0 deg
  rotation_direction: CBCT Clockwise
  anode_voltage: 100 kV
  exposure: 100 mAs
  fan_mode: Full Fan
  imaging_mode: Image Gently
  rotation_rate: 0.4 deg/s
  timeline_end: 501.0 s
  sequential_times: '1000'
  time_verbosity: '0'
  field_x1: 14 cm
  field_x2: 14 cm
  field_y1: 10.7 cm
  field_y2: 10.7 cm
  blade_x1: 6.175536078965273 cm
  blade_x2: -6.175536078965273 cm
  blade_y1: 5.814471115800571 cm
  blade_y2: -5.814471115800571 cm
dicom:
  dicom_directory: /sampledicom/setA
  dicom_rp_file: /sampledicom/RP.sample.dcm
  patient_id: ''
  isocenter_x: 0 mm
  isocenter_y: 0 mm
  isocenter_z: 0 mm
  patient_shift_x: 0. mm
  patient_shift_y: 0. mm
  patient_shift_z: 0. mm
  patient_yaw: 0. deg
  graphics_enabled: false
ctdi:
  phantom_size: 16 cm
  dose_to_medium_zbins: '100'
  tle_zbins: '100'
  dose_to_water_zbins: '100'
  couch_enabled: true
  couch_width: 260. mm
  couch_thickness: 0.4 mm
  couch_length: 1000 mm
  user_blade_enabled: false
  user_field_x1: 14 cm
  user_field_x2: 14 cm
  user_field_y1: 10.7 cm
  user_field_y2: 10.7 cm
  graphics_enabled: false
