# Phase 1 production: TsCAD STL bow-tie, Full Fan Head, static beam.
# Cross-plane (Z) profile scored by the validate_bowtie TLE slab at isocenter.
# Wide Z-field (user_field_x) so the collimator does not cut the bow-tie profile;
# X-field stays at the Head 10.7 cm default (slab integrates the central X strip).
general:
  g4_data_directory: /opt/topas/GEANT4/G4DATA
  topas_directory: /opt/topas/TOPAS/OpenTOPAS-install/bin/topas
  seed: '9'
  threads: '20'
  histories: 8000000
  log_filename: simulation.log
imaging:
  simulation_type: CTDI
  rotation_direction: CBCT Clockwise
  imaging_mode: Head
  fan_mode: Full Fan
  sequential_times: '1'
  legacy_bowtie: false
ctdi:
  phase_space_mode: score
  validate_bowtie: true
  validate_bowtie_hvlmap: true
  user_blade_enabled: true
  user_field_x1: 32 cm
  user_field_x2: 32 cm
  user_field_y1: 10.7 cm
  user_field_y2: 10.7 cm
  dose_to_medium_zbins: '100'
  tle_zbins: '100'
  dose_to_water_zbins: '100'
  couch_enabled: false
  couch_width: 260 mm
  couch_thickness: 0.4 mm
  couch_length: 1000 mm
  graphics_enabled: false
