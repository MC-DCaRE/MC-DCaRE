# MC-DCaRE Phantom Protocol: Pelvis CBCT (125 kV Half Fan)
# Calibrated against CTDIw = 15.9 mGy (calibration.example.yaml)
# Reference effective dose: 4.2 mSv (PCXMC, 80kg/180cm person)
general:
  g4_data_directory: /opt/topas/GEANT4/G4DATA
  topas_directory: /opt/topas/TOPAS/OpenTOPAS-install/bin/topas
  seed: '42'
  threads: '20'
  histories: '1000000'
  log_filename: simulation.log
imaging:
  simulation_type: ICRP145
  rotation_direction: CBCT Anticlockwise
  imaging_mode: Pelvis
  exposure: '1074 mAs'
  sequential_times: '150'
phantom:
  phantom_data_directory: data/P145/Phantom_data
  phantom_sex: AM
  phantom_name: MRCP_AM
  organ_scoring_ids: Blood
  trans_x: 0.0 cm
  trans_y: 0.0 cm
  trans_z: 0.0 cm
  rot_x: 0.0 deg
  rot_y: 0.0 deg
  rot_z: 0.0 deg
  couch_enabled: true
  couch_width: 260 mm
  couch_thickness: 0.4 mm
  couch_length: 1000 mm
  graphics_enabled: false