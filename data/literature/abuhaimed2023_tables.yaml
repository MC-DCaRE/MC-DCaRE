# Abuhaimed & Martin 2023 (J Radiol Prot; eprints.gla.ac.uk/152785) Tables 2-3.
# Organ and size-specific effective doses per 100 mAs for kV-CBCT chest and
# pelvis scans, NCI/UF hybrid phantom library (193 adults) grouped by WHO BMI
# class, BEAMnrc/DOSXYZnrc (EGSnrc) MC of the Varian TrueBeam OBI.
#
# Technique: 120 kV, 360 deg, single default field 22 cm (longitudinal) x
# 28.1 cm (lateral), phase-space replay per scan position. Doses in
# mGy/100 mAs (organs) and mSv/100 mAs (effective). Transcribed from the
# manuscript Tables 2-3 (BMI classes C1 underweight .. C6 obesity-III plus
# the all-size average "All").
#
# CAVEATS for comparison against MC-DCaRE: (1) kV differs (ours 125 kV vs
# their 120 kV) -- per-100 mAs normalization removes mAs, not kV; expect a
# few-% harder spectrum at 125 kV. (2) Their OBI generation (V2.5-class,
# 2023 paper) may differ from this machine's techniques. (3) Only organs
# fully/partially inside the scan field are listed.
source: "Abuhaimed & Martin 2023, BMI phantom library, EGSnrc MC"
kV: 120
scan: 360 deg, default field 22 x 28.1 cm
bmi_classes: [C1, C2, C3, C4, C5, C6, All]
