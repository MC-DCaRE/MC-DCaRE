# No-bowtie control: HF, Half Fan Pelvis (125 kV), static beam.
# CAX spectrum -> HVL compared to the measured RaySafe Pelvis HF CAX HVL
# (8.06 mm Al). The HF field (blades 24.7/3.3) natively covers isocenter, so
# no wide-field override is needed.
general:
  g4_data_directory: /opt/topas/GEANT4/G4DATA
  topas_directory: /opt/topas/TOPAS/OpenTOPAS-install/bin/topas
  seed: '9'
  threads: '20'
  histories: '8000000'
  log_filename: simulation.log
imaging:
  simulation_type: CTDI
  rotation_direction: CBCT Clockwise
  imaging_mode: Pelvis
  fan_mode: Half Fan
  sequential_times: '1'
  legacy_bowtie: true
  bowtie_enabled: false
ctdi:
  phase_space_mode: score
  validate_bowtie: true
  dose_to_medium_zbins: '100'
  tle_zbins: '100'
  dose_to_water_zbins: '100'
  couch_enabled: false
  couch_width: 260 mm
  couch_thickness: 0.4 mm
  couch_length: 1000 mm
  user_blade_enabled: false
  graphics_enabled: false
