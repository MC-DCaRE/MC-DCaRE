[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mc-dcare"
version = "0.2.0"
description = "Monte Carlo Dose Calculation and Radiation Evaluation"
authors = [
    {name = "MC-DCaRE Team"}
]
readme = "README.md"
license = {text = "LICENSE"}
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "typer",
    "rich",
    "pytest>=8.3.5",
    "spekpy>=2.5.4",
    "freesimplegui>=5.2.0.post1",
    "numpy>=1.24.4",
    "pydicom>=2.4.4",
    "pytest-mock>=3.14.1",
    "pytest-cov>=5.0.0",
    "pyyaml",
    "jinja2>=3.1.0",
]

[project.scripts]
mc-dcare = "run_simulation:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
per-file-ignores = { "topas_gui.py" = ["F403", "F405"] }

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["FreeSimpleGUI.*", "spekpy", "pandas"]
ignore_missing_imports = true
