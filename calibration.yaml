# DCFs recomputed 2026-08-11 with unified normalization
# (fix-normalization-unified-dcf): raw_absolute_dose_Gy divides by the
# scorer-active history count (TOPAS CSV Histories_with_Scorer_Active) rather
# than metadata total_histories.
#
# TLE DCFs are valid: TLE is fluence-based and works in the air-filled
# LayeredMassGeometry parallel worlds. Source runfolders (direct-beam):
#   80 FF  -> runfolder/2026-07-03_10-02-04 (500M), 100 FF -> 2026-06-18_13-59-02,
#   125 FF -> runfolder/2026-06-18_14-38-24,        125 HF -> 2026-07-02_14-10-55,
#   140 HF -> runfolder/2026-06-18_15-53-30
#
# DTW/DTM DCFs are omitted (None): collision-based scorers register ~0
# interactions in air-filled chamber cavities (Count_in_Bin=0, see AGENTS.md
# LMG note). A literal 0 would be treated as a valid factor and silently
# zero out phantom dose, so the keys are omitted to make lookup_dcf return
# None. Meaningful DTW/DTM DCFs require re-running with water-filled
# chambers (ctdi.water_chamber_enabled=True), which is out of scope for this
# post-processing-only change. The 125 HF dcf_dtm was previously derived
# from rotational water-hole data that is no longer in the repo.
machine: TrueBeam
date_calibrated: '2026-08-11'

# Reference effective doses (mSv) for the generic 80 kg reference phantom.
effective_dose_references:
  "4D Spotlight": 1.6
  "4D Thorax": 3.3
  "Abdo Spotlight": 1.2
  "Abdomen": 2.8
  "Breast 360": 0.2
  "Extremity Spotlight": 0.5
  "Head": 0.5
  "Head and Shoulders": 0.3
  "Head SRS": 1.8
  "Pelvis": 4.2
  "Pelvis Spotlight": 2.2
  "SBRT Spine": 1.7
  "Thorax": 1.3
  "Thorax Spotlight": 0.7

calibrations:
- kV: 80
  fan_mode: Full Fan
  reference_mAs: 100.2
  measured_ctdi_w_mGy: 0.9
  reference_protocol: Image Gently
  dcf_tle: 0.10730208453092686
- kV: 100
  fan_mode: Full Fan
  reference_mAs: 150.3
  measured_ctdi_w_mGy: 3.2
  reference_protocol: Head
  dcf_tle: 0.11910700100791230
- kV: 125
  fan_mode: Full Fan
  reference_mAs: 751.5
  measured_ctdi_w_mGy: 12.3
  reference_protocol: Pelvis Spotlight
  dcf_tle: 0.12390529509419883
- kV: 125
  fan_mode: Half Fan
  reference_mAs: 1080.0
  measured_ctdi_w_mGy: 15.9
  reference_protocol: Pelvis
  dcf_tle: 0.16287014977928360
  # Interim body-tissue DTM DCF from the reference effective dose
  # (E_ref=4.2 mSv / E_raw_MC=152.13 mGy), computed with the new
  # normalization from the direct-beam phantom run
  # phantom_runs/2026-07-02_05-19-13 (phantom_dtm.csv, target 1080 mAs).
  # Correct for direct-beam phantom sims; NOT valid for phase-space replay
  # until phantom CSVs emit Histories_with_Scorer_Active. A CTDI-derived DTM
  # DCF requires real-geometry water chambers (parallel-world water chambers
  # segfault in TOPAS and give zero under LayeredMassGeometry -- see
  # AGENTS.md).
  dcf_dtm: 0.027607966870439756
- kV: 140
  fan_mode: Half Fan
  reference_mAs: 1700.5
  measured_ctdi_w_mGy: 37.1
  reference_protocol: Pelvis Large
  dcf_tle: 0.18122529730598380
