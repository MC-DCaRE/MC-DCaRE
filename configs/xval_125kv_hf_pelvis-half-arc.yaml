# MC-DCaRE CTDI validation: half-arc arc dependence test
# 125 kV Half Fan, Pelvis, half rotation (timeline_end=450 s, seq_times=80)
# Tests whether DCF is independent of arc length (raw CTDI_w should halve)
# Note: sequential_times controls statistics only, not arc geometry.
# Arc geometry is controlled by timeline_end + rotation_rate.

general:
  g4_data_directory: /home/bchcphysics/Applications/GEANT4/G4DATA
  topas_directory: /home/bchcphysics/Applications/TOPAS/OpenTOPAS-build/topas
  seed: '9'
  threads: '20'
  histories: '1000000'
  dose_calibration_factor: '1.0'
  log_filename: simulation.log
imaging:
  simulation_type: CTDI
  rotation_direction: CBCT Clockwise
  imaging_mode: Pelvis
  sequential_times: '80'
  timeline_end: '450 s'
  time_verbosity: '0'
ctdi:
  dose_to_medium_zbins: '100'
  tle_zbins: '100'
  dose_to_water_zbins: '100'
  couch_enabled: true
  couch_width: 260. mm
  couch_thickness: 0.4 mm
  couch_length: 1000 mm
  user_blade_enabled: false
  user_field_x1: 14 cm
  user_field_x2: 14 cm
  user_field_y1: 10.7 cm
  user_field_y2: 10.7 cm
  graphics_enabled: false
