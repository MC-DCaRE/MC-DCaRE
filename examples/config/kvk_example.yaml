# MC-DCaRE kV-kV simulation configuration example
#
# Static pair of orthogonal kV images (e.g. 0 deg and 90 deg).
# rotation_direction: kV-kV triggers the TOPAS Step function so the beam
# switches from start_angle to start_angle + 90 at the half-way point.
#
# Usage:
#   uv run python run_simulation.py run examples/config/kvk_example.yaml
#   uv run python run_simulation.py validate examples/config/kvk_example.yaml

general:
  g4_data_directory: /root/G4Data
  topas_directory: /root/topas/bin/topas
  seed: '9'
  threads: '1'
  histories: '100000'
  dose_calibration_factor: '1.0'
  log_filename: simulation.log
imaging:
  simulation_type: CTDI validation
  start_angle: 0 deg
  rotation_direction: kV-kV
  anode_voltage: 100 kV
  exposure: 100 mAs
  fan_mode: Full Fan
  imaging_mode: Head
  rotation_rate: 0 deg/s
  timeline_end: 2.0 s
  sequential_times: '2'
  time_verbosity: '0'
  field_x1: 14 cm
  field_x2: 14 cm
  field_y1: 10.7 cm
  field_y2: 10.7 cm
  blade_x1: 6.175536078965273 cm
  blade_x2: -6.175536078965273 cm
  blade_y1: 5.814471115800571 cm
  blade_y2: -5.814471115800571 cm
ctdi:
  phantom_size: 16 cm
  dose_to_medium_zbins: '100'
  tle_zbins: '100'
  dose_to_water_zbins: '100'
  couch_enabled: true
  couch_width: 260. mm
  couch_thickness: 0.4 mm
  couch_length: 1000 mm
  user_blade_enabled: false
  user_field_x1: 14 cm
  user_field_x2: 14 cm
  user_field_y1: 10.7 cm
  user_field_y2: 10.7 cm
  graphics_enabled: false
