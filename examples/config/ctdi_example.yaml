# MC-DCaRE CTDI validation configuration example
# Generate a template: uv run python run_simulation.py generate-config
# Validate:            uv run python run_simulation.py validate config.yaml
#
# Beam parameters are auto-populated from the imaging mode lookup table.
# Override any beam field by adding it explicitly under imaging:.

general:
  g4_data_directory: /path/to/G4Data
  topas_directory: /path/to/topas/bin/topas
  seed: '9'
  threads: '4'
  histories: '10000'
  log_filename: simulation.log
imaging:
  simulation_type: CTDI
  rotation_direction: CBCT Clockwise
  imaging_mode: Head
  sequential_times: '1000'
ctdi:
  dose_to_medium_zbins: '100'
  tle_zbins: '100'
  dose_to_water_zbins: '100'
  couch_enabled: true
  couch_width: 260. mm
  couch_thickness: 0.4 mm
  couch_length: 1000 mm
  user_blade_enabled: false
  user_field_x1: 14 cm
  user_field_x2: 14 cm
  user_field_y1: 10.7 cm
  user_field_y2: 10.7 cm
  graphics_enabled: false
