# DCFs recomputed 2026-08-11 with unified normalization
# (fix-normalization-unified-dcf): raw_absolute_dose_Gy divides by the
# scorer-active history count (TOPAS CSV Histories_with_Scorer_Active) rather
# than metadata total_histories.
#
# Source: 5 direct-beam calibration runs at 180M histories (5M x 36 sequential
# times) with water-filled chamber cavities (water_chamber_enabled=True):
#   80 FF  -> runfolder/2026-08-11_14-33-57, 100 FF -> 2026-08-11_15-34-37,
#   125 FF -> runfolder/2026-08-11_16-34-38,  125 HF -> 2026-08-11_17-33-14,
#   140 HF -> runfolder/2026-08-11_18-32-20.
#
# dcf_tle (Track Length Estimator, fluence-based): the PRIMARY transferable
# DCF -- valid for both CTDI CTDIw and phantom organ dose (TLE is
# geometry-independent per-history).
#
# dcf_water_dtm (DoseToMaterial in the water-filled CTDI chamber plug):
# CTDI-phantom-specific. Cross-validates dcf_tle (within 4% across all 5
# protocols). Does NOT transfer to phantom body tissue (DTM is collision-based;
# interaction rate differs between the chamber and body voxels).
#
# dcf_dtm (DoseToMedium body tissue, phantom organ dose): derived from the
# reference effective dose (DCF_dtm = E_ref / E_raw_MC), NOT from the CTDI
# water chamber. Only populated for 125 HF (Pelvis) where phantom data exists.
machine: TrueBeam
date_calibrated: '2026-08-11'

# Reference effective doses (mSv) for the generic 80 kg reference phantom.
effective_dose_references:
  "4D Spotlight": 1.6
  "4D Thorax": 3.3
  "Abdo Spotlight": 1.2
  "Abdomen": 2.8
  "Breast 360": 0.2
  "Extremity Spotlight": 0.5
  "Head": 0.5
  "Head and Shoulders": 0.3
  "Head SRS": 1.8
  "Pelvis": 4.2
  "Pelvis Spotlight": 2.2
  "SBRT Spine": 1.7
  "Thorax": 1.3
  "Thorax Spotlight": 0.7

calibrations:
- kV: 80
  fan_mode: Full Fan
  reference_mAs: 100.2
  measured_ctdi_w_mGy: 0.9
  reference_protocol: Image Gently
  dcf_tle: 0.10720179547259340
  dcf_water_dtm: 0.11025585368661243
- kV: 100
  fan_mode: Full Fan
  reference_mAs: 150.3
  measured_ctdi_w_mGy: 3.2
  reference_protocol: Head
  dcf_tle: 0.11836764523050886
  dcf_water_dtm: 0.1221793528723298
- kV: 125
  fan_mode: Full Fan
  reference_mAs: 751.5
  measured_ctdi_w_mGy: 12.3
  reference_protocol: Pelvis Spotlight
  dcf_tle: 0.12001912616221766
  dcf_water_dtm: 0.12359047021105164
- kV: 125
  fan_mode: Half Fan
  reference_mAs: 1080.0
  measured_ctdi_w_mGy: 15.9
  reference_protocol: Pelvis
  dcf_tle: 0.16070247613705832
  dcf_water_dtm: 0.16720285885953350
  # Body-tissue DTM DCF from reference effective dose (4.2 / 152.13), for
  # phantom organ dose. NOT the CTDI water-chamber value above.
  dcf_dtm: 0.027607966870439756
- kV: 140
  fan_mode: Half Fan
  reference_mAs: 1700.5
  measured_ctdi_w_mGy: 37.1
  reference_protocol: Pelvis Large
  dcf_tle: 0.17572359541823268
  dcf_water_dtm: 0.17646064182324922
